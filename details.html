<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Application - MoMo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #f4f4f4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER ===== */
        .header {
            background: #ffffff;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 3px solid #ffcc00;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .back-arrow {
            font-size: 22px;
            color: #333;
            text-decoration: none;
            line-height: 1;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .back-arrow:hover {
            transform: translateX(-3px);
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: #ffcc00;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 11px;
            color: #004f9f;
            line-height: 1;
            text-align: center;
            border: 2px solid #004f9f;
        }

        .logo-text {
            font-weight: 800;
            font-size: 20px;
            color: #004f9f;
            letter-spacing: -0.5px;
        }

        .header-title {
            font-size: 16px;
            font-weight: 700;
            color: #222;
            margin-left: 4px;
            flex: 1;
        }

        .hamburger {
            font-size: 22px;
            color: #333;
            cursor: pointer;
            line-height: 1;
            user-select: none;
        }

        /* ===== MAIN ===== */
        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 40px 16px 60px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 520px;
            border-radius: 16px;
            padding: 40px 36px 36px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            height: fit-content;
        }

        .card h1 {
            font-size: 28px;
            font-weight: 800;
            color: #111;
            text-align: center;
            margin-bottom: 8px;
        }

        .step-text {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 16px;
        }

        /* ===== PROGRESS BAR ===== */
        .progress {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
            justify-content: center;
        }

        .progress .bar {
            height: 5px;
            width: 70px;
            border-radius: 3px;
            background: #e0e0e0;
        }

        .progress .bar.active {
            background: #ffcc00;
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            font-family: inherit;
            border: 1.5px solid #ddd;
            border-radius: 10px;
            background: #fff;
            color: #111;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #ffcc00;
            box-shadow: 0 0 0 3px rgba(255, 204, 0, 0.2);
        }

        .form-group input::placeholder {
            color: #aaa;
        }

        /* Two-column row */
        .form-row {
            display: flex;
            gap: 16px;
        }

        .form-row .form-group {
            flex: 1;
        }

        /* Phone input with country code */
        .phone-row {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }

        .country-code {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 600;
            color: #333;
            border: 1.5px solid #ddd;
            border-radius: 10px;
            background: #fafafa;
            white-space: nowrap;
        }

        .phone-row input {
            flex: 1;
        }

        .helper-text {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }

        /* ===== BUTTONS ===== */
        .btn-group {
            display: flex;
            gap: 14px;
            margin-top: 32px;
        }

        .prev-btn {
            flex: 1;
            background: #f0f0f0;
            color: #333;
            border: none;
            padding: 16px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-transform: uppercase;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .prev-btn:hover {
            background: #e0e0e0;
        }

        .next-btn {
            flex: 1;
            background: #ffcc00;
            color: #111;
            border: none;
            padding: 16px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-transform: uppercase;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .next-btn:hover {
            background: #e6b800;
        }

        .next-btn:active,
        .prev-btn:active {
            transform: scale(0.99);
        }

        /* ===== FOOTER ===== */
        .footer {
            background: #111;
            color: #ffcc00;
            text-align: center;
            padding: 18px;
            font-size: 13px;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 20px;
            }
            .card h1 {
                font-size: 23px;
            }
            .header-title {
                font-size: 14px;
            }
            .logo-text {
                font-size: 18px;
            }
            .progress .bar {
                width: 55px;
            }
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <a href="apply.html" class="back-arrow">←</a>
        <div class="logo-box">
            <div class="logo-icon">MoMo<br>MTN</div>
            <span class="logo-text">MoMo</span>
        </div>
        <span class="header-title">MTN Mobile Services</span>
        <span class="hamburger">☰</span>
    </header>

    <!-- MAIN -->
    <main class="main">
        <div class="card">
            <h1>Loan Application</h1>
            <p class="step-text">Step 2 of 3</p>

            <!-- Progress bar -->
            <div class="progress">
                <div class="bar active"></div>
                <div class="bar active"></div>
                <div class="bar"></div>
            </div>

            <!-- FORM -->
            <form id="detailsForm">
                <!-- First Name + Last Name -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName" placeholder="Jessy" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName" placeholder="Kimutai" required>
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="jessykimutai8@gmail.com" required>
                </div>

                <!-- Phone Number -->
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <div class="phone-row">
                        <span class="country-code">+260</span>
                        <input type="tel" id="phone" name="phone" placeholder="0714915335" required>
                    </div>
                    <p class="helper-text">Enter 9-10 digits (e.g., 97XXXXXXXX)</p>
                </div>

                <!-- Buttons -->
                <div class="btn-group">
                    <a href="apply.html" class="prev-btn" id="prevBtn">Previous</a>
                    <a href="confirm.html" class="next-btn" id="nextBtn">Next Step</a>
                </div>
            </form>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        © 2026 MoMo
    </footer>

    <script>
        // ─── Preserve URL params from apply.html ───
        const incoming = new URLSearchParams(window.location.search);

        // ─── Previous button keeps data intact ───
        document.getElementById('prevBtn').addEventListener('click', function () {
            this.href = `apply.html?${incoming.toString()}`;
        });

        // ─── On Next Step: bundle everything and pass to confirm.html ───
        document.getElementById('nextBtn').addEventListener('click', function () {
            const data = new URLSearchParams(incoming); // keep loan info

            data.set('firstName', document.getElementById('firstName').value);
            data.set('lastName',  document.getElementById('lastName').value);
            data.set('email',     document.getElementById('email').value);
            data.set('phone',     document.getElementById('phone').value);

            this.href = `confirm.html?${data.toString()}`;
        });
    </script>
</body>
</html>
